name: nav3d-native

services:
  nav3d:
    build:
      context: .
      dockerfile: docker/Dockerfile.ros2
      args:
        ROS_DISTRO: ${ROS_DISTRO:-humble}
        BUILD_JOBS: ${BUILD_JOBS:-4}
    image: nav3d-native:${ROS_DISTRO:-humble}
    network_mode: host
    ipc: host
    privileged: true
    init: true
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
      RMW_IMPLEMENTATION: ${RMW_IMPLEMENTATION:-rmw_fastrtps_cpp}
      NAV3D_DATA_ROOT: /data
      DISPLAY: ${DISPLAY:-}
    volumes:
      - ${NAV3D_DATA_ROOT:-./data}:/data
      - /dev:/dev
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    command: ${NAV3D_COMMAND:-ros2 launch nav_bringup full_stack.launch.py}
